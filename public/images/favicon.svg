<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tenor+Sans&amp;display=swap');
      .favicon-text {
        font-family: 'Tenor Sans', sans-serif;
        fill: #FFFFFF;
        font-size: 160px; /* Slightly reduced size to fit the period perfectly */
        text-anchor: middle;
        dominant-baseline: central;
      }
      .italic-c {
        font-style: italic;
      }
    </style>
  </defs>

  <circle cx="256" cy="256" r="256" fill="#59363A" />

  <text x="256" y="256" class="favicon-text">M<tspan class="italic-c">C</tspan>.</text>
</svg>
